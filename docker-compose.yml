# CRM Quiebre · stack completo (app + base de datos) para Dokploy.
#
# - Servicios: quiebre-crm (app) y quiebre-crm-db (MariaDB).
# - Sin puertos publicados en el host: el puerto lo asigna/ruta Traefik (dominio configurado en Dokploy → crm.quiebre.cl).
# - La base de datos vive en el mismo stack y solo es accesible por la red interna.
# - Todo se configura con variables de entorno (ver .env.dokploy.example).

services:
  quiebre-crm:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      quiebre-crm-db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Quiebre CRM}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?Define APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://crm.quiebre.cl}
      ASSET_URL: ${ASSET_URL:-}
      APP_LOCALE: ${APP_LOCALE:-es}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-es}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mariadb
      DB_HOST: quiebre-crm-db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-quiebre_crm}
      DB_USERNAME: ${DB_USERNAME:-quiebre}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: ${MAIL_MAILER:-log}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador Quiebre}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@quiebre.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - crm-storage:/var/www/html/storage/app
    networks:
      - dokploy-network

  quiebre-crm-db:
    image: mariadb:11.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-quiebre_crm}
      MARIADB_USER: ${DB_USERNAME:-quiebre}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: America/Santiago
    volumes:
      - crm-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - dokploy-network

volumes:
  crm-storage:
  crm-db-data:

# Red compartida de Dokploy/Traefik (no crea redes nuevas). Los nombres de servicio son únicos (quiebre-crm-*)
# para no chocar con otros stacks que usan la misma red.
networks:
  dokploy-network:
    external: true
  # Dokploy agrega la red «default» al servicio con dominio; se fija su subred para no depender de los
  # pools de direcciones de Docker (el servidor los tiene agotados).
  default:
    ipam:
      config:
        - subnet: 10.231.77.0/24
