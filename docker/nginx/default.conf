server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Herramienta privada: ningún buscador debe indexar nada (también assets y respuestas PHP).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets compilados por Vite (nombres con hash): caché larga.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Detrás de Traefik: el esquema y el host reales vienen en X-Forwarded-*.
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        # Inertia/Vite envían cabeceras Link de precarga muy largas: buffers amplios evitan el 502
        # «upstream sent too big header».
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
