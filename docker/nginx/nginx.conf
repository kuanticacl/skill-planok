user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25M;
    # Cuerpos de petición grandes (textos pegados al Agent, archivos, audio) se guardan en un directorio escribible
    # por el usuario de nginx (www-data); el de Alpine pertenece a otro usuario y daba «Permission denied» → 500.
    client_body_buffer_size 4m;
    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml font/ttf font/otf;

    include /etc/nginx/http.d/*.conf;
}
